<!-- GENERATE REPORT BUTTON -->
<div class="mt-6 flex gap-4">

  <button
    onclick="generateReport()"
    class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-semibold"
  >
    Generate Report
  </button>

</div>

<!-- REPORT SECTION -->
<div id="reportSection" class="card p-6 mt-6 hidden">

  <div class="flex justify-between items-center mb-6">

    <h2 class="text-2xl font-bold text-yellow-500">
      Generated Report
    </h2>

    <div class="bg-green-100 text-green-700 px-4 py-2 rounded-xl font-bold">
      REPORT READY
    </div>

  </div>

  <!-- REPORT DETAILS -->
  <div class="grid grid-cols-3 gap-6 mb-6">

    <div class="bg-slate-50 rounded-xl p-4">

      <p class="text-gray-500 text-sm">
        Average Resistance
      </p>

      <h3 id="avgResistance" class="text-3xl font-bold text-blue-700 mt-2">
        0 Ω
      </h3>

    </div>

    <div class="bg-slate-50 rounded-xl p-4">

      <p class="text-gray-500 text-sm">
        Final Resistance
      </p>

      <h3 id="finalResistance" class="text-3xl font-bold text-blue-700 mt-2">
        0 Ω
      </h3>

    </div>

    <div class="bg-slate-50 rounded-xl p-4">

      <p class="text-gray-500 text-sm">
        Test Status
      </p>

      <h3 id="status" class="text-3xl font-bold text-green-600 mt-2">
        PASS
      </h3>

    </div>

  </div>

  <!-- GRAPH -->
  <div class="bg-white rounded-2xl border p-5">

    <h2 class="text-xl font-bold text-yellow-500 mb-4">
      Resistance Visualization
    </h2>

    <canvas id="chartCanvas"></canvas>

  </div>

</div>

<script>

let chart;

function generateReport(){

  const rows =
    document.querySelectorAll('#tableBody tr');

  let labels = [];
  let resistanceData = [];

  let totalResistance = 0;

  rows.forEach(row => {

    const inputs =
      row.querySelectorAll('input');

    const distance =
      parseFloat(inputs[0].value) || 0;

    const voltage =
      parseFloat(inputs[1].value) || 0;

    const current =
      parseFloat(inputs[2].value) || 1;

    const resistance =
      voltage / current;

    row.querySelector('.resistanceCell').innerText =
      resistance.toFixed(2);

    labels.push(distance + 'm');

    resistanceData.push(resistance.toFixed(2));

    totalResistance += resistance;

  });

  const avgResistance =
    totalResistance / rows.length;

  const finalResistance =
    Math.max(...resistanceData);

  // SHOW REPORT SECTION
  document.getElementById('reportSection')
    .classList.remove('hidden');

  // UPDATE REPORT VALUES
  document.getElementById('avgResistance')
    .innerText =
      avgResistance.toFixed(2) + ' Ω';

  document.getElementById('finalResistance')
    .innerText =
      finalResistance + ' Ω';

  document.getElementById('status')
    .innerText =
      'PASS';

  renderChart(labels, resistanceData);

}

function renderChart(labels, data){

  const ctx =
    document.getElementById('chartCanvas');

  if(chart){
    chart.destroy();
  }

  chart = new Chart(ctx, {

    type:'line',

    data:{

      labels:labels,

      datasets:[{

        label:'Resistance (Ω)',

        data:data,

        borderColor:'#2563EB',

        backgroundColor:'rgba(37,99,235,0.15)',

        fill:true,

        tension:0.4,

        pointRadius:5,

        borderWidth:3

      }]
    },

    options:{

      responsive:true,

      plugins:{

        legend:{
          display:true
        }

      },

      scales:{

        x:{
          title:{
            display:true,
            text:'Probe Distance'
          }
        },

        y:{
          title:{
            display:true,
            text:'Resistance (Ω)'
          }
        }

      }

    }

  });

}

</script>
